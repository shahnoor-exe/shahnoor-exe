name: Update Top Languages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_top_languages.py'
      - '.github/workflows/update-top-languages.yml'
  workflow_dispatch:
  # Daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Top Languages SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_top_languages.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet assets/top-languages.svg && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg
          git commit -m "chore: update Top Languages card [skip ci]"
          git push
