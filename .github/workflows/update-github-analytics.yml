name: Update GitHub Analytics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_github_analytics.py'
      - '.github/workflows/update-github-analytics.yml'
  workflow_dispatch:
  # Daily at 00:00 UTC (05:30 IST)
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Analytics SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_github_analytics.py

      - name: Check for changes
        id: changes
        run: |
          git add assets/github-stats.svg assets/github-streak.svg assets/top-languages.svg
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub analytics SVGs [skip ci]"
          git push
