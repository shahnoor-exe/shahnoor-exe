<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; rx: 12; }
      .titlebar { fill: #161B22; }
      .dot-r { fill: #FF5F56; }
      .dot-y { fill: #FFBD2E; }
      .dot-g { fill: #27C93F; }
      .title { fill: #94A3B8; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-anchor: middle; }
      .metric-value { fill: #22D3EE; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: bold; text-anchor: middle; }
      .metric-label { fill: #94A3B8; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; text-anchor: middle; }
      .divider { stroke: #273449; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="420" height="160" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="418.5" height="158.5" rx="12"/>
  <rect class="titlebar" x="1" y="1" width="418" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="418" height="12"/>
  <circle class="dot-r" cx="20" cy="19" r="6"/>
  <circle class="dot-y" cx="38" cy="19" r="6"/>
  <circle class="dot-g" cx="56" cy="19" r="6"/>
  <text class="title" x="210.0" y="23">shahnoor-exe's Contribution Streak</text>
  <g transform="translate(0, 40)">

    <!-- Total -->
    <text class="metric-value" x="70" y="55">406</text>
    <text class="metric-label" x="70" y="80">Total Days</text>
    
    <line class="divider" x1="140" y1="20" x2="140" y2="90"/>
    
    <!-- Current Streak Ring -->
    <circle cx="210" cy="45" r="30" fill="none" stroke="#273449" stroke-width="4"/>
    <circle cx="210" cy="45" r="30" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="140" stroke-dashoffset="40"/>
    
    <!-- Flame Icon -->
    <path d="M210 15C210 15 207 19 207 22C207 23.5 208.5 25 210 25C211.5 25 213 23.5 213 22C213 19 210 15 210 15Z" fill="#F59E0B"/>
    
    <text class="metric-value" x="210" y="55">12</text>
    <text class="metric-label" x="210" y="100" fill="#22D3EE">Current Streak</text>
    
    <line class="divider" x1="280" y1="20" x2="280" y2="90"/>
    
    <!-- Longest -->
    <text class="metric-value" x="350" y="55" fill="#94A3B8">20</text>
    <text class="metric-label" x="350" y="80">Longest Streak</text>

  </g>
</svg>