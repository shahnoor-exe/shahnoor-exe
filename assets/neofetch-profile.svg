<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; }
      .titlebar { fill: #161B22; }
      .dot-r { fill: #FF5F56; }
      .dot-y { fill: #FFBD2E; }
      .dot-g { fill: #27C93F; }
      .title { fill: #8B949E; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }
      .prompt { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; }
      .cmd { fill: #E5E7EB; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; }
      .label { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12.5px; font-weight: bold; }
      .value { fill: #E5E7EB; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12.5px; }
      .sep { fill: #273449; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12.5px; }
      .palette-box { rx: 2; ry: 2; }
      .cursor { fill: #22D3EE; }
      .divider { stroke: #273449; stroke-width: 0.5; }

      .info-row { opacity: 0; animation: slideIn 0.2s ease-out forwards; }
      .r0  { animation-delay: 0.3s; }
      .r1  { animation-delay: 0.5s; }
      .r2  { animation-delay: 0.7s; }
      .r3  { animation-delay: 0.9s; }
      .r4  { animation-delay: 1.1s; }
      .r5  { animation-delay: 1.3s; }
      .r6  { animation-delay: 1.5s; }
      .r7  { animation-delay: 1.7s; }
      .r8  { animation-delay: 1.9s; }
      .r9  { animation-delay: 2.1s; }
      .r10 { animation-delay: 2.3s; }
      .r11 { animation-delay: 2.6s; }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s step-end 0.2s 5;
        animation-fill-mode: forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .info-row { animation: none; opacity: 1; }
        .cursor { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="520" height="420" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="518.5" height="418.5" rx="12"/>

  <!-- Title Bar -->
  <rect class="titlebar" x="1" y="1" width="518" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="518" height="12"/>
  <circle class="dot-r" cx="20" cy="19" r="6"/>
  <circle class="dot-y" cx="38" cy="19" r="6"/>
  <circle class="dot-g" cx="56" cy="19" r="6"/>
  <text class="title" x="260" y="23" text-anchor="middle">neofetch — shahnoor@github</text>

  <!-- Command prompt -->
  <g class="info-row r0">
    <text class="prompt" x="20" y="62">shahnoor@github:~$</text>
    <text class="cmd" x="178" y="62">neofetch</text>
    <rect class="cursor" x="240" y="51" width="7" height="14" rx="1"/>
  </g>

  <!-- Divider -->
  <line class="divider" x1="20" y1="74" x2="500" y2="74"/>

  <!-- Info Rows -->
  <g class="info-row r1">
    <text class="label" x="20" y="100">USER</text>
    <text class="sep" x="130" y="100">::</text>
    <text class="value" x="152" y="100">Shahnoor Ahmed Laskar</text>
  </g>

  <g class="info-row r2">
    <text class="label" x="20" y="126">ROLE</text>
    <text class="sep" x="130" y="126">::</text>
    <text class="value" x="152" y="126">AI/ML Developer</text>
  </g>

  <g class="info-row r3">
    <text class="label" x="20" y="152">SPECIALTY</text>
    <text class="sep" x="130" y="152">::</text>
    <text class="value" x="152" y="152">Data Science + Full-Stack Systems</text>
  </g>

  <g class="info-row r4">
    <text class="label" x="20" y="178">FOCUS</text>
    <text class="sep" x="130" y="178">::</text>
    <text class="value" x="152" y="178">Advanced AI Systems &amp; Data Science</text>
  </g>

  <g class="info-row r5">
    <text class="label" x="20" y="204">EDUCATION</text>
    <text class="sep" x="130" y="204">::</text>
    <text class="value" x="152" y="204">B.E. CSE (Honors) in Data Science</text>
  </g>

  <g class="info-row r6">
    <text class="label" x="20" y="230">CGPA</text>
    <text class="sep" x="130" y="230">::</text>
    <text class="value" x="152" y="230">8.04</text>
  </g>

  <g class="info-row r7">
    <text class="label" x="20" y="256">LOCATION</text>
    <text class="sep" x="130" y="256">::</text>
    <text class="value" x="152" y="256">Chandigarh, India</text>
  </g>

  <g class="info-row r8">
    <text class="label" x="20" y="282">STATUS</text>
    <text class="sep" x="130" y="282">::</text>
    <text class="value" x="152" y="282">Building production-grade AI systems</text>
  </g>

  <g class="info-row r9">
    <text class="label" x="20" y="308">FUN FACT</text>
    <text class="sep" x="130" y="308">::</text>
    <text class="value" x="152" y="308">I bridge tech innovation with ops efficiency</text>
  </g>

  <!-- Divider -->
  <g class="info-row r10">
    <line class="divider" x1="20" y1="328" x2="500" y2="328"/>
  </g>

  <!-- Color Palette Row -->
  <g class="info-row r11">
    <rect class="palette-box" x="20"  y="342" width="28" height="14" fill="#22D3EE"/>
    <rect class="palette-box" x="52"  y="342" width="28" height="14" fill="#14B8A6"/>
    <rect class="palette-box" x="84"  y="342" width="28" height="14" fill="#8B5CF6"/>
    <rect class="palette-box" x="116" y="342" width="28" height="14" fill="#A855F7"/>
    <rect class="palette-box" x="148" y="342" width="28" height="14" fill="#3B82F6"/>
    <rect class="palette-box" x="180" y="342" width="28" height="14" fill="#22C55E"/>
    <rect class="palette-box" x="212" y="342" width="28" height="14" fill="#E5E7EB"/>
    <rect class="palette-box" x="244" y="342" width="28" height="14" fill="#94A3B8"/>
  </g>

  <!-- Bottom Prompt -->
  <g class="info-row r11">
    <text class="prompt" x="20" y="393">shahnoor@github:~$</text>
    <rect class="cursor" x="178" y="382" width="7" height="14" rx="1" style="animation-delay: 3s;"/>
  </g>
</svg>
