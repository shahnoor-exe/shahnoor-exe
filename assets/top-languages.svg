<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; rx: 12; }
      .titlebar { fill: #161B22; }
      .dot-r { fill: #FF5F56; }
      .dot-y { fill: #FFBD2E; }
      .dot-g { fill: #27C93F; }
      .title { fill: #8B949E; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .prompt { fill: #22D3EE; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: bold; }
      .cmd { fill: #E5E7EB; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .lang-name { fill: #E5E7EB; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; }
      .lang-pct { fill: #94A3B8; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .bar-bg { fill: #161B22; rx: 4; }
      .divider { stroke: #273449; stroke-width: 0.5; }
      .info-text { fill: #8B949E; font-family: 'JetBrains Mono', monospace; font-size: 9px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="420" height="320" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="418.5" height="318.5" rx="12"/>

  <!-- Title Bar -->
  <rect class="titlebar" x="1" y="1" width="418" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="418" height="12"/>
  <circle class="dot-r" cx="20" cy="19" r="6"/>
  <circle class="dot-y" cx="38" cy="19" r="6"/>
  <circle class="dot-g" cx="56" cy="19" r="6"/>
  <text class="title" x="210.0" y="23" text-anchor="middle">Top Languages by Repository Usage</text>

  <!-- Command prompt -->
  <text class="prompt" x="20" y="60">$</text>
  <text class="cmd" x="32" y="60">analyze_repos --user=shahnoor-exe</text>
  
  <line class="divider" x1="20" y1="72" x2="400" y2="72"/>

  <g transform="translate(20, 80)">
