<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; rx: 12; }
      .titlebar { fill: #161B22; }
      .dot-r { fill: #FF5F56; }
      .dot-y { fill: #FFBD2E; }
      .dot-g { fill: #27C93F; }
      .title { fill: #94A3B8; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-anchor: middle; }
      .metric-value { fill: #22D3EE; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: bold; text-anchor: middle; }
      .metric-label { fill: #94A3B8; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; text-anchor: middle; }
      .divider { stroke: #273449; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="420" height="140" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="418.5" height="138.5" rx="12"/>
  <rect class="titlebar" x="1" y="1" width="418" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="418" height="12"/>
  <circle class="dot-r" cx="20" cy="19" r="6"/>
  <circle class="dot-y" cx="38" cy="19" r="6"/>
  <circle class="dot-g" cx="56" cy="19" r="6"/>
  <text class="title" x="210.0" y="23">shahnoor-exe's GitHub Stats</text>
  <g transform="translate(0, 40)">

    <text class="metric-value" x="70" y="50">517</text>
    <text class="metric-label" x="70" y="75">Contributions</text>
    
    <line class="divider" x1="140" y1="20" x2="140" y2="80"/>
    
    <text class="metric-value" x="210" y="50" fill="#8B5CF6">0</text>
    <text class="metric-label" x="210" y="75">Total Stars</text>
    
    <line class="divider" x1="280" y1="20" x2="280" y2="80"/>
    
    <text class="metric-value" x="350" y="50" fill="#14B8A6">329</text>
    <text class="metric-label" x="350" y="75">Total Commits</text>

  </g>
</svg>