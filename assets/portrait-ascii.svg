<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440">
  <title>Animated terminal-style ASCII portrait</title>
  <defs>
    <style>

      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; rx: 12; }
      .titlebar { fill: #161B22; }
      .dot-r { fill: #FF5F56; }
      .dot-y { fill: #FFBD2E; }
      .dot-g { fill: #27C93F; }
      .title-text { fill: #8B949E; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; text-anchor: middle; }
      .prompt { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }
      .cmd { fill: #E5E7EB; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }
      .ascii-line { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; white-space: pre; }
      .cursor { fill: #22D3EE; }
      .glow { filter: drop-shadow(0 0 3px rgba(34, 211, 238, 0.3)); }

      .ascii-line { opacity: 0; animation: revealLine 0.1s ease-out forwards; }
      
      @keyframes revealLine {
        from { opacity: 0; transform: translateX(-4px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s step-end 0.2s 6;
        animation-fill-mode: forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .ascii-line { animation: none; opacity: 1; }
        .cursor { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background & Frame -->
  <rect class="bg" width="520" height="440" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="518.5" height="438.5" rx="12"/>

  <!-- Title Bar -->
  <rect class="titlebar" x="1" y="1" width="518" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="518" height="12"/>
  <circle class="dot-r" cx="20" cy="19" r="6"/>
  <circle class="dot-y" cx="38" cy="19" r="6"/>
  <circle class="dot-g" cx="56" cy="19" r="6"/>
  <text class="title-text" x="260.0" y="23">portrait.render — bash</text>

  <!-- Command Prompt -->
  <text class="prompt" x="20" y="60">shahnoor@github:~$</text>
  <text class="cmd" x="166" y="60">./render-portrait.sh</text>
  
  <rect class="cursor" x="314" y="50" width="7" height="13" rx="1"/>

