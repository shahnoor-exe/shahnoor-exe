<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; rx: 12; }
      .titlebar { fill: #161B22; }
      .dot-red { fill: #FF5F56; }
      .dot-yellow { fill: #FFBD2E; }
      .dot-green { fill: #27C93F; }
      .title-text { fill: #8B949E; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .prompt { fill: #22D3EE; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .prompt-cmd { fill: #E5E7EB; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .ascii-line { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; opacity: 0; }
      .ascii-line-v { fill: #8B5CF6; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; opacity: 0; }
      .status-text { fill: #14B8A6; font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0; }
      .cursor { fill: #22D3EE; }
      .glow { filter: drop-shadow(0 0 3px rgba(34, 211, 238, 0.3)); }

      /* Line-by-line reveal animation */
      .ascii-line, .ascii-line-v { animation: revealLine 0.15s ease-out forwards; }
      .status-text { animation: revealLine 0.3s ease-out forwards; }

      .l1  { animation-delay: 0.5s; }
      .l2  { animation-delay: 0.6s; }
      .l3  { animation-delay: 0.7s; }
      .l4  { animation-delay: 0.8s; }
      .l5  { animation-delay: 0.9s; }
      .l6  { animation-delay: 1.0s; }
      .l7  { animation-delay: 1.1s; }
      .l8  { animation-delay: 1.2s; }
      .l9  { animation-delay: 1.3s; }
      .l10 { animation-delay: 1.4s; }
      .l11 { animation-delay: 1.5s; }
      .l12 { animation-delay: 1.6s; }
      .l13 { animation-delay: 1.7s; }
      .l14 { animation-delay: 1.8s; }
      .l15 { animation-delay: 1.9s; }
      .l16 { animation-delay: 2.0s; }
      .l17 { animation-delay: 2.1s; }
      .l18 { animation-delay: 2.2s; }
      .l19 { animation-delay: 2.3s; }
      .l20 { animation-delay: 2.4s; }
      .l21 { animation-delay: 2.5s; }
      .l22 { animation-delay: 2.6s; }
      .l23 { animation-delay: 2.7s; }
      .l24 { animation-delay: 2.8s; }
      .l25 { animation-delay: 2.9s; }
      .l26 { animation-delay: 3.0s; }
      .l27 { animation-delay: 3.1s; }
      .l28 { animation-delay: 3.2s; }
      .l29 { animation-delay: 3.3s; }
      .l30 { animation-delay: 3.4s; }
      .l31 { animation-delay: 3.6s; }
      .l32 { animation-delay: 3.8s; }

      @keyframes revealLine {
        from { opacity: 0; transform: translateX(-4px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s step-end 0.3s 6;
        animation-fill-mode: forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .ascii-line, .ascii-line-v, .status-text {
          animation: none;
          opacity: 1;
        }
        .cursor { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="420" height="520" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="418.5" height="518.5" rx="12"/>

  <!-- Title Bar -->
  <rect class="titlebar" x="1" y="1" width="418" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="418" height="12"/>
  <circle class="dot-red" cx="20" cy="19" r="6"/>
  <circle class="dot-yellow" cx="38" cy="19" r="6"/>
  <circle class="dot-green" cx="56" cy="19" r="6"/>
  <text class="title-text" x="210" y="23" text-anchor="middle">portrait.render — bash</text>

  <!-- Command Prompt -->
  <text class="prompt" x="16" y="58">shahnoor@github:~$</text>
  <text class="prompt-cmd" x="162" y="58">./render-portrait.sh</text>

  <!-- Blinking cursor -->
  <rect class="cursor" x="310" y="48" width="7" height="14" rx="1"/>

  <!-- ASCII Portrait - Stylized Developer Silhouette -->
  <g class="glow">
    <!-- Hair / Top of head -->
    <text class="ascii-line l1"  x="120" y="88">          ████████████          </text>
    <text class="ascii-line l2"  x="120" y="99">       ████████████████████       </text>
    <text class="ascii-line l3"  x="120" y="110">     ██████████████████████████     </text>
    <text class="ascii-line l4"  x="120" y="121">    ████████████████████████████    </text>

    <!-- Forehead -->
    <text class="ascii-line-v l5"  x="120" y="132">   ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓   </text>
    <text class="ascii-line-v l6"  x="120" y="143">  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  </text>

    <!-- Eyes region -->
    <text class="ascii-line l7"  x="120" y="154">  ▓▓▓▓  ████  ▓▓▓▓▓▓  ████  ▓▓▓▓  </text>
    <text class="ascii-line l8"  x="120" y="165">  ▓▓▓▓  █░░█  ▓▓▓▓▓▓  █░░█  ▓▓▓▓  </text>
    <text class="ascii-line l9"  x="120" y="176">  ▓▓▓▓  ████  ▓▓▓▓▓▓  ████  ▓▓▓▓  </text>

    <!-- Nose -->
    <text class="ascii-line-v l10" x="120" y="187">  ▓▓▓▓▓▓▓▓▓▓▓▓▓██▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  </text>
    <text class="ascii-line-v l11" x="120" y="198">  ▓▓▓▓▓▓▓▓▓▓▓▓▓██▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  </text>
    <text class="ascii-line-v l12" x="120" y="209">  ▓▓▓▓▓▓▓▓▓▓▓▓████▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  </text>

    <!-- Mouth -->
    <text class="ascii-line l13" x="120" y="220">   ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓   </text>
    <text class="ascii-line l14" x="120" y="231">    ▓▓▓▓▓▓▓ ████████ ▓▓▓▓▓▓▓▓▓    </text>
    <text class="ascii-line l15" x="120" y="242">     ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓     </text>

    <!-- Chin / Jaw -->
    <text class="ascii-line-v l16" x="120" y="253">      ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓      </text>
    <text class="ascii-line-v l17" x="120" y="264">       ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓       </text>
    <text class="ascii-line-v l18" x="120" y="275">        ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓        </text>
    <text class="ascii-line-v l19" x="120" y="286">          ▓▓▓▓▓▓▓▓▓▓▓▓▓▓          </text>

    <!-- Neck -->
    <text class="ascii-line l20" x="120" y="297">           ████████████           </text>
    <text class="ascii-line l21" x="120" y="308">           ████████████           </text>

    <!-- Shoulders / Collar -->
    <text class="ascii-line l22" x="120" y="319">      ████████████████████████      </text>
    <text class="ascii-line l23" x="120" y="330">    ████████████████████████████    </text>
    <text class="ascii-line l24" x="120" y="341">  ██████████████████████████████████  </text>
    <text class="ascii-line l25" x="120" y="352"> ████████████████████████████████████ </text>

    <!-- Torso -->
    <text class="ascii-line-v l26" x="120" y="363">█████████████████████████████████████</text>
    <text class="ascii-line-v l27" x="120" y="374">█████████████████████████████████████</text>
    <text class="ascii-line-v l28" x="120" y="385">█████████████████████████████████████</text>
    <text class="ascii-line-v l29" x="120" y="396">█████████████████████████████████████</text>
    <text class="ascii-line-v l30" x="120" y="407">█████████████████████████████████████</text>
  </g>

  <!-- Status line -->
  <text class="status-text l31" x="16" y="445">[render] Portrait rendered successfully.</text>
  <text class="status-text l32" x="16" y="465">[system] Shahnoor Ahmed Laskar — AI/ML Developer</text>

  <!-- Separator line -->
  <line x1="16" y1="480" x2="404" y2="480" stroke="#273449" stroke-width="0.5"/>

  <!-- Bottom prompt -->
  <text class="prompt" x="16" y="500">shahnoor@github:~$</text>
  <rect class="cursor" x="162" y="490" width="7" height="14" rx="1" style="animation-delay: 4s;"/>
</svg>
