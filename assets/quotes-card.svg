<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: none; stroke: #273449; stroke-width: 1.5; }
      .titlebar { fill: #161B22; }
      .dot-r { fill: #FF5F56; }
      .dot-y { fill: #FFBD2E; }
      .dot-g { fill: #27C93F; }
      .title { fill: #8B949E; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }
      .quote { fill: #E5E7EB; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; font-style: italic; }
      .accent { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 18px; }
      .author { fill: #14B8A6; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; font-weight: bold; }
      .divider { stroke: #273449; stroke-width: 0.5; }
      .q-mark { fill: #8B5CF6; font-family: Georgia, serif; font-size: 48px; opacity: 0.3; }
      .prompt { fill: #22D3EE; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }
      .cmd { fill: #94A3B8; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }

      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .f1 { animation-delay: 0.3s; }
      .f2 { animation-delay: 0.8s; }
      .f3 { animation-delay: 1.3s; }
      .f4 { animation-delay: 1.8s; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .fade-in { animation: none; opacity: 1; }
      }

      /* Subtle scanline overlay */
      .scanlines {
        fill: url(#scanline-pattern);
        opacity: 0.03;
        pointer-events: none;
      }
    </style>
    <pattern id="scanline-pattern" x="0" y="0" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="#E5E7EB"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="260" rx="12"/>
  <rect class="frame" x="0.75" y="0.75" width="798.5" height="258.5" rx="12"/>

  <!-- Scanline overlay -->
  <rect class="scanlines" x="1" y="37" width="798" height="222" rx="0"/>

  <!-- Title Bar -->
  <rect class="titlebar" x="1" y="1" width="798" height="36" rx="12"/>
  <rect class="titlebar" x="1" y="25" width="798" height="12"/>
  <circle class="dot-r" cx="20" cy="19" r="6"/>
  <circle class="dot-y" cx="38" cy="19" r="6"/>
  <circle class="dot-g" cx="56" cy="19" r="6"/>
  <text class="title" x="400" y="23" text-anchor="middle">words_i_live_by.md — shahnoor</text>

  <!-- Command -->
  <text class="prompt" x="24" y="60">$</text>
  <text class="cmd" x="36" y="60">cat words_i_live_by.md</text>

  <!-- Decorative quote mark -->
  <text class="q-mark" x="24" y="120">"</text>

  <!-- Quote 1 -->
  <g class="fade-in f1">
    <text class="accent" x="56" y="100">&#x276E;</text>
    <text class="quote" x="74" y="100">"A single moment of absolute focus can rewrite a lifetime of uncertainty."</text>
  </g>

  <!-- Quote 2 -->
  <g class="fade-in f2">
    <text class="accent" x="56" y="135">&#x276E;</text>
    <text class="quote" x="74" y="135">"My terminal is the sanctuary where mysteries unfold."</text>
  </g>

  <!-- Quote 3 -->
  <g class="fade-in f3">
    <text class="accent" x="56" y="170">&#x276E;</text>
    <text class="quote" x="74" y="170">"A single insight is worth a thousand sleepless hours."</text>
  </g>

  <!-- Divider -->
  <line class="divider" x1="56" y1="192" x2="744" y2="192"/>

  <!-- Attribution -->
  <g class="fade-in f4">
    <text class="author" x="56" y="218">— Shahnoor Ahmed Laskar</text>
  </g>

  <!-- Bottom prompt -->
  <text class="prompt" x="24" y="246">$</text>
</svg>
